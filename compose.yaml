services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      DATABASE_PATH: /data/tickets.db
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
      ERP_TRUSTED_PROXY_COUNT: ${ERP_TRUSTED_PROXY_COUNT:-0}
    volumes:
      - supportdesk-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  supportdesk-data:
